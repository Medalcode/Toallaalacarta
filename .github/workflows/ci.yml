name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: "yarn"

      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Run Linter
        run: yarn check

      - name: Run Tests
        run: yarn test --run
